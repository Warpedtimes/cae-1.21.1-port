    side="BOTH"
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.9,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="[19.2,20)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
